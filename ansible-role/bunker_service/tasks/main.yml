---
- name: Ensure Bunkerweb user home directory exists
  ansible.builtin.file:
    path: "{{ bunker_service_home }}/.config/containers/systemd/configs"
    state: directory
    owner: "{{ bunker_service_user }}"
    mode: "0755"

- name: Deploy Bunkerweb Quadlet files (container, volume, network)
  ansible.builtin.copy:
    src: "{{ bunker_role_dir }}/../../quadlets/"
    dest: "{{ bunker_service_home }}/.config/containers/systemd/"
    owner: "{{ bunker_service_user }}"
    mode: "0644"
    directory_mode: "0755"

- name: Template Bunkerweb environment file
  ansible.builtin.template:
    src: bunkerized_nginx.env.j2
    dest: "{{ bunker_service_home }}/.config/containers/systemd/configs/bunkerized_nginx.env"
    owner: "{{ bunker_service_user }}"
    mode: "0600"

- name: Template JSON analytics environment file
  ansible.builtin.template:
    src: json_analytics.env.j2
    dest: "{{ bunker_service_home }}/.config/containers/systemd/configs/json_analytics.env"
    owner: "{{ bunker_service_user }}"
    mode: "0644"

- name: Reload systemd user daemon for Bunkerweb
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  become: yes
  become_user: "{{ bunker_service_user }}"
